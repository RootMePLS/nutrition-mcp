# One-shot local stack: `docker compose up -d --build` brings up PostgreSQL,
# applies all forward-only migrations via the one-shot `migrate` service, then
# starts the app. App is healthy only when /ready proves a real DB query works.
#
# Host port 18080 is used because the live local dev server occupies :8080.
# The db service intentionally publishes no host port (local postgres owns 5432).

services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: nutrition
            POSTGRES_PASSWORD: nutrition
            POSTGRES_DB: nutrition_mcp
        volumes:
            - nutrition-mcp-db:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition_mcp"]
            interval: 5s
            timeout: 3s
            retries: 10

    migrate:
        image: postgres:16-alpine
        depends_on:
            db:
                condition: service_healthy
        environment:
            PGHOST: db
            PGPORT: "5432"
            PGUSER: nutrition
            PGPASSWORD: nutrition
            PGDATABASE: nutrition_mcp
        volumes:
            - ./db/migrations:/migrations:ro
            - ./scripts/migrate.sh:/migrate.sh:ro
        entrypoint: ["sh", "/migrate.sh"]
        restart: "no"

    # ------------------------------------------------------------------
    # OPT-IN `hostdb` profile — targets the LIVE host PostgreSQL database
    # `nutrition_mcp` on 127.0.0.1:5432 (reached via host.docker.internal).
    # This is the user's REAL data. Nothing here is destructive:
    # migrate-hostdb only re-applies the forward-only idempotent
    # migrations (a no-op on an already-migrated database), and no
    # service in this profile creates, drops, or volumes any database.
    # A plain `docker compose up` NEVER starts these services; they run
    # only with `docker compose --profile hostdb ...`.
    # ------------------------------------------------------------------
    migrate-hostdb:
        image: postgres:16-alpine
        profiles: ["hostdb"]
        environment:
            PGHOST: host.docker.internal
            PGPORT: "5432"
            PGUSER: ${HOSTDB_PGUSER:-fishhead}
            PGDATABASE: nutrition_mcp
        volumes:
            - ./db/migrations:/migrations:ro
            - ./scripts/migrate.sh:/migrate.sh:ro
        entrypoint: ["sh", "/migrate.sh"]
        restart: "no"

    app:
        build: .
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        environment:
            DATABASE_URL: postgres://nutrition:nutrition@db:5432/nutrition_mcp
            PORT: "8080"
            MEDIA_ROOT: /app/var/media
            OFF_USER_AGENT: ${OFF_USER_AGENT:-}
        ports:
            - "18080:8080"
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "fetch('http://localhost:8080/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        restart: unless-stopped

    # App instance for the `hostdb` profile — connects to the LIVE host
    # `nutrition_mcp` (real data). Published on :18081 because :8080 is
    # the non-Docker dev server and :18080 is the isolated compose app.
    app-hostdb:
        build: .
        profiles: ["hostdb"]
        depends_on:
            migrate-hostdb:
                condition: service_completed_successfully
        environment:
            DATABASE_URL: postgres://${HOSTDB_PGUSER:-fishhead}@host.docker.internal:5432/nutrition_mcp
            PORT: "8080"
            MEDIA_ROOT: /app/var/media
            OFF_USER_AGENT: ${OFF_USER_AGENT:-}
        ports:
            - "18081:8080"
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "fetch('http://localhost:8080/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        restart: unless-stopped

volumes:
    nutrition-mcp-db:
