name: CI

# Runs on every pull request and on every push to main. There is no remote
# auto-deploy: the runtime server runs locally (bun run src/index.ts). This
# workflow is the correctness gate — it runs the same acceptance gates the
# repo defines (format, typecheck, unit gate, destructive DB gate against a
# disposable service PostgreSQL) and proves the Docker image assembles.
#
# The DB gate (scripts/test-db-gate.ts) refuses to run unless DATABASE_URL and
# DATABASE_URL_TEST both point at the SAME disposable database; it drops and
# rebuilds schema `public` and applies all migrations itself before every
# suite, so no separate migration step is needed here.

on:
    pull_request:
    push:
        branches: ["main"]

jobs:
    check:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: nutrition_mcp_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting
              run: bun run format:check

            - name: Typecheck src/
              run: bun run typecheck

            - name: Unit gate (non-DB suites)
              run: bun run test:unit

            - name: DB gate (destructive suites on disposable service DB)
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/nutrition_mcp_test
                  DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/nutrition_mcp_test
              run: bun run test:db

            - name: Validate compose file
              run: docker compose config -q

            - name: Docker image builds
              run: docker build -t nutrition-mcp:ci .
